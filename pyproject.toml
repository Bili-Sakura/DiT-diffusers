[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusers-dit"
version = "0.1.0"
description = "Diffusers-native Scalable Diffusion Models with Transformers (DiT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
    "diffusers>=0.30.1",
    "torch",
    "torchvision",
    "safetensors",
    "numpy",
    "tqdm",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
